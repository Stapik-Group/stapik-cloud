openapi: 3.0.3
info:
  title: Stapik Cloud - Application API
  version: 1.0.3
  description: >
    API used by Stapik ecosystem client applications (desktop C++/GTK4, Android) to
    sync documents and binary assets. Authentication: x-api-key header, a key is
    assigned 1:1 to a single Extension and a single device. Responses to requests made with a key that
    expires soon carry the X-Api-Key-Expires-At header (ISO-8601 instant).


    Every authenticated response carries the rate limit state of the key (per minute):
    X-RateLimit-Limit (allowed requests), X-RateLimit-Remaining (requests left) and
    X-RateLimit-Reset (seconds until the full allowance is restored). Over the limit the
    API answers 429 with a Retry-After header (seconds) and a problem body whose
    retryAfterSeconds field repeats it; requests rejected that way are not processed.

servers:
  - url: /api/v1

security:
  - ApiKeyAuth: []

tags:
  - name: documents
  - name: assets
  - name: asset-uploads
  - name: system

paths:
  /documents/{slotKey}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get the current content of a document in the given slot
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
      responses:
        '200':
          description: Current document content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          description: Document slot or document not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    put:
      operationId: writeDocument
      tags: [documents]
      summary: Write document content (conflict detected via If-Match, optionally with shadow copy)
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentWriteRequest'
      responses:
        '200':
          description: Saved, returns the current state after the write
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '409':
          description: >
            If-Match did not match the current ETag - the write lost against a newer copy in the cloud and the
            client's content was saved to history as CONFLICT_DISCARDED if the slot
            has shadow copy enabled.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document (soft-delete, keeps version history)
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
      responses:
        '204':
          description: Deleted
        '404':
          description: Document slot or document not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'


  /changes:
    get:
      operationId: listChanges
      tags: [documents]
      summary: List documents and partitions changed since the given moment
      description: >
        Returns metadata of every document (main or partition) of the key's extension whose
        updatedAt is later than `since`, oldest first, including deleted ones (`deleted: true`).
        Use `serverTime` of the response as `since` of the next call.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Changed documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentChangeListResponse'
        '400':
          description: Missing or malformed since
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/partitions:
    get:
      operationId: listDocumentPartitions
      tags: [documents]
      summary: List the named partitions of a document slot (e.g. archived years)
      description: >
        A partition is an independent document inside the same slot, with its own content,
        version history and conflict resolution. The main document of the slot is not listed.
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
      responses:
        '200':
          description: Existing partitions, sorted by key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPartitionListResponse'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/partitions/{partition}:
    get:
      operationId: getDocumentPartition
      tags: [documents]
      summary: Get the current content of a partition
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/PartitionParam'
      responses:
        '200':
          description: Current partition content
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Invalid partition key
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '404':
          description: Document slot or partition not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    put:
      operationId: writeDocumentPartition
      tags: [documents]
      summary: Write partition content (created on first write, same conflict handling as the main document)
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/PartitionParam'
        - $ref: '#/components/parameters/IfMatchParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentWriteRequest'
      responses:
        '200':
          description: Saved, returns the current state after the write
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Invalid partition key
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '409':
          description: The write lost against a newer copy in the cloud (see writeDocument)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
    delete:
      operationId: deleteDocumentPartition
      tags: [documents]
      summary: Delete a partition (soft-delete, keeps version history)
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/PartitionParam'
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid partition key
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '404':
          description: Document slot or partition not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/partitions/{partition}/versions:
    get:
      operationId: listDocumentPartitionVersions
      tags: [documents]
      summary: List historical versions of a partition
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/PartitionParam'
      responses:
        '200':
          description: List of versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionListResponse'
        '400':
          description: Invalid partition key
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '404':
          description: Document slot or partition not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/partitions/{partition}/versions/{versionId}/restore:
    post:
      operationId: restoreDocumentPartitionVersion
      tags: [documents]
      summary: Restore the given version as the current partition content
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/PartitionParam'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Invalid partition key
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '404':
          description: Document slot, partition or version not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/versions:
    get:
      operationId: listDocumentVersions
      tags: [documents]
      summary: List historical versions of a document
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
      responses:
        '200':
          description: List of versions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionListResponse'
        '404':
          description: Document slot or document not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /documents/{slotKey}/versions/{versionId}/restore:
    post:
      operationId: restoreDocumentVersion
      tags: [documents]
      summary: Restore the given version as the current document content
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          description: Document slot, document or version not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /assets/{slotKey}:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List files in a BINARY_COLLECTION slot
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
      responses:
        '200':
          description: List of files with metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /assets/{slotKey}/{filename}:
    get:
      operationId: downloadAsset
      tags: [assets]
      summary: Download a binary file
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/FilenameParam'
      responses:
        '200':
          description: File content (streamed)
          content:
            multipart/form-data:
              schema:
                type: string
                format: binary
        '404':
          description: Document slot or asset not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    put:
      operationId: uploadAsset
      tags: [assets]
      summary: Upload or overwrite a binary file (streamed)
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/FilenameParam'
        - $ref: '#/components/parameters/ChecksumSha256Header'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMetadataResponse'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '413':
          description: Maximum file size for this slot exceeded
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '422':
          description: Checksum of the received content does not match X-Checksum-Sha256; the previous file is left untouched
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete a binary file
      parameters:
        - $ref: '#/components/parameters/SlotKeyParam'
        - $ref: '#/components/parameters/FilenameParam'
      responses:
        '204':
          description: Deleted
        '404':
          description: Document slot or asset not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
  /asset-uploads:
    post:
      operationId: createAssetUpload
      tags: [asset-uploads]
      summary: Start a resumable, chunked upload of a binary file (for files too large for a single multipart request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetUploadRequest'
      responses:
        '201':
          description: Upload started, the first chunk goes at offset 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadResponse'
        '404':
          description: Document slot not found
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '413':
          description: Declared file size exceeds the slot limit
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'

  /asset-uploads/{uploadId}:
    get:
      operationId: getAssetUpload
      tags: [asset-uploads]
      summary: Current state of an upload; use its offset to resume after an interruption
      parameters:
        - $ref: '#/components/parameters/UploadIdParam'
      responses:
        '200':
          description: Upload state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadResponse'
        '404':
          description: Upload not found or expired; if the last chunk was sent, it may have completed - check the asset list
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    patch:
      operationId: appendAssetUploadChunk
      tags: [asset-uploads]
      x-internal: true
      summary: >
        Append the next chunk. The chunk must start at the upload's current offset and the request must carry
        Content-Length. The upload completes, and the asset is stored, when the last byte arrives.
      parameters:
        - $ref: '#/components/parameters/UploadIdParam'
        - name: Upload-Offset
          in: header
          required: true
          description: Offset of the first byte of this chunk within the file.
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk stored; the asset is present once the upload is complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUploadResponse'
        '404':
          description: Upload not found or expired
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '409':
          description: Upload-Offset does not match the upload offset - read it with GET and resume from there
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '411':
          description: Content-Length is missing
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '413':
          description: Chunk is larger than the allowed chunk size or than the bytes remaining
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
        '422':
          description: Completed content does not match the declared SHA-256; the upload is discarded
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
    delete:
      operationId: abortAssetUpload
      tags: [asset-uploads]
      summary: Abort an upload and discard the received data
      parameters:
        - $ref: '#/components/parameters/UploadIdParam'
      responses:
        '204':
          description: Aborted
        '404':
          description: Upload not found or expired
          content:
            application/json:
              schema:
                $ref: 'common/error.yaml#/components/schemas/Problem'
  /me:
    get:
      operationId: getMe
      tags: [system]
      summary: Context of the currently used API key
      responses:
        '200':
          description: Information about the key and its Extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  headers:
    ETag:
      description: Quoted content hash of the returned document - send it back in If-Match when writing.
      schema:
        type: string

  parameters:
    IfMatchParam:
      name: If-Match
      in: header
      required: false
      description: >
        ETag of the document version the client last saw (the ETag header of a previous read or write).
        A missing or stale value on an existing document is a conflict.
      schema:
        type: string
    SlotKeyParam:
      name: slotKey
      in: path
      required: true
      schema:
        type: string
    PartitionParam:
      name: partition
      in: path
      required: true
      description: >
        Partition key, e.g. a year ("2024"). Letters, digits, '.', '_' and '-', up to 100 characters,
        starting with a letter or digit.
      schema:
        type: string
      example: "2024"
    FilenameParam:
      name: filename
      in: path
      required: true
      schema:
        type: string
    ChecksumSha256Header:
      name: X-Checksum-Sha256
      in: header
      required: false
      description: SHA-256 of the uploaded file; the upload is rejected when it differs from the checksum computed by the server.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{64}$'
    UploadIdParam:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DocumentResponse:
      type: object
      required: [slotKey, content, contentHash, updatedAt]
      properties:
        slotKey:
          type: string
        content:
          type: string
        contentHash:
          type: string
        updatedAt:
          type: string
          format: date-time

    DocumentWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    DocumentVersionResponse:
      type: object
      required: [id, savedAt, reason]
      properties:
        id:
          type: string
          format: uuid
        savedAt:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/VersionReason'
        deviceId:
          type: string
          format: uuid
          description: Id of the API key (device) that wrote this version; absent for versions written from the admin panel.
        deviceLabel:
          type: string
          description: Label of that device's API key at the time of writing.

    VersionReason:
      type: string
      enum: [NORMAL_WRITE, CONFLICT_DISCARDED, MANUAL_RESTORE]

    DocumentVersionListResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersionResponse'

    DocumentPartitionResponse:
      type: object
      required: [partition, sizeBytes, contentHash, updatedAt]
      properties:
        partition:
          type: string
        sizeBytes:
          type: integer
          format: int64
        contentHash:
          type: string
        updatedAt:
          type: string
          format: date-time

    DocumentChangeResponse:
      type: object
      required: [slotKey, sizeBytes, contentHash, updatedAt, deleted]
      properties:
        slotKey:
          type: string
        partition:
          type: string
          description: Partition key, absent for the main document of the slot.
        sizeBytes:
          type: integer
          format: int64
        contentHash:
          type: string
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean

    DocumentChangeListResponse:
      type: object
      required: [serverTime, changes]
      properties:
        serverTime:
          type: string
          format: date-time
        changes:
          type: array
          items:
            $ref: '#/components/schemas/DocumentChangeResponse'

    DocumentPartitionListResponse:
      type: object
      required: [partitions]
      properties:
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartitionResponse'

    AssetMetadataResponse:
      type: object
      required: [filename, mimeType, sizeBytes, checksumSha256, updatedAt]
      properties:
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        checksumSha256:
          type: string
        updatedAt:
          type: string
          format: date-time

    CreateAssetUploadRequest:
      type: object
      required: [slotKey, filename, sizeBytes]
      properties:
        slotKey:
          type: string
        filename:
          type: string
          maxLength: 255
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          maxLength: 100
        checksumSha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: Optional SHA-256 of the whole file; verified when the last chunk arrives.

    AssetUploadResponse:
      type: object
      required: [uploadId, filename, sizeBytes, offset, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        filename:
          type: string
        sizeBytes:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
          description: Number of bytes received so far; the next chunk starts here.
        expiresAt:
          type: string
          format: date-time
          description: The upload is discarded after this time; every chunk extends it.
        asset:
          $ref: '#/components/schemas/AssetMetadataResponse'

    AssetListResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetMetadataResponse'

    MeResponse:
      type: object
      required: [extensionId, extensionSlug, scope]
      properties:
        extensionId:
          type: string
          format: uuid
        extensionSlug:
          type: string
        keyLabel:
          type: string
        scope:
          type: string
          enum: [READ_ONLY, READ_WRITE]
        lastUsedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [status, error, message, path, timestamp]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string