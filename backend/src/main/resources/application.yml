server:
  port: ${SERVER_PORT:8077}
  forward-headers-strategy: native

spring:
  application:
    name: stapik-cloud-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stapikcloud}
    username: ${DB_USER:stapikcloud}
    password: ${DB_PASSWORD:stapikcloud}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${ASSET_MAX_FILE_SIZE:512MB}
      max-request-size: ${ASSET_MAX_REQUEST_SIZE:512MB}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Application API
        url: /openapi/app-api.yaml
      - name: Admin API
        url: /openapi/admin-api.yaml

stapik-cloud:
  admin:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    api-key-header: x-api-key
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
      issuer: stapik-cloud
    refresh-token:
      expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
      reuse-leeway-seconds: 30
  admin-bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  asset-storage:
    root-path: ${ASSET_STORAGE_ROOT:/var/lib/stapik-cloud/assets}
  asset-upload:
    base-path: /api/v1/asset-uploads
    session-ttl: ${ASSET_UPLOAD_SESSION_TTL:24h}
    max-chunk-size: ${ASSET_UPLOAD_MAX_CHUNK_SIZE:64MB}
  encryption:
    active-key-id: ${ENCRYPTION_ACTIVE_KEY_ID:1}
    keys: ${ENCRYPTION_KEYS}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:365}
  rate-limit:
    login:
      ip-requests-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:20}
      max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-duration: ${LOGIN_LOCKOUT_DURATION:15m}
    api-key:
      requests-per-minute: ${API_KEY_RATE_LIMIT_PER_MINUTE:600}

logging:
  level:
    root: INFO
    pl.stapik.cloud: ${APP_LOG_LEVEL:INFO}
    pl.stapik.cloud.config.GlobalHttpLoggingFilter: DEBUG
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_BASIC_BINDER_LOGS:OFF}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.stapikgroup.stapikcloud: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
