name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify -Dtest='*Test,*IT' -Dsurefire.failIfNoSpecifiedTests=false

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Generate API types from the OpenAPI spec
        run: npm run generate:api-types
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Lint deploy.sh
        run: |
          bash -n deploy/proxmox/deploy.sh
          shellcheck --severity=error deploy/proxmox/deploy.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate client SDKs
        run: sdk/generate.sh all

  images:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: admin
            context: admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.name == 'admin' && 'openapi=backend/src/main/resources/openapi' || '' }}
          load: true
          push: false
          tags: stapik-cloud-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stapik-cloud-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
