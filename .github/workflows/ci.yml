name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify -Dtest='*Test,*IT' -Dsurefire.failIfNoSpecifiedTests=false

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Generate API types from the OpenAPI spec
        run: npm run generate:api-types
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies for HIGH and CRITICAL vulnerabilities
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1 fs \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs node_modules --skip-dirs target --exit-code 1 /src

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Lint deploy.sh
        run: |
          bash -n deploy/proxmox/deploy.sh
          shellcheck --severity=error deploy/proxmox/deploy.sh
