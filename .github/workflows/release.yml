name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve names
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Image tags (admin)
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-admin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish admin image
        uses: docker/build-push-action@v6
        with:
          context: admin
          build-contexts: openapi=backend/src/main/resources/openapi
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build release artifacts
        run: |
          mkdir -p dist
          (cd backend && mvn -B -ntp -DskipTests package)
          cp backend/target/*.jar "dist/stapik-cloud-backend-${VERSION}.jar"

          (cd admin && npm ci && npm run generate:api-types && npm run build)
          tar -czf "dist/stapik-cloud-admin-${VERSION}.tar.gz" -C admin/.next/standalone .
          tar -czf "dist/stapik-cloud-admin-static-${VERSION}.tar.gz" -C admin/.next static

          export SDK_VERSION="${VERSION}"
          sdk/generate.sh all
          for sdk in kotlin cpp; do
            (cd "sdk/${sdk}" && zip -qr "../../dist/stapik-cloud-sdk-${sdk}-${VERSION}.zip" .)
          done

          cp deploy/docker-compose.yml deploy/.env.example deploy/proxmox/deploy.sh dist/
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "${TAG}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${TAG}" dist/* --title "${TAG}" --generate-notes --verify-tag "${prerelease[@]}"
